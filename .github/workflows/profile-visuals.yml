name: Profile visuals — stats and contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches:
      - main
      - design/midnight-mint-profile-readme
    paths:
      - README.md
      - .github/workflows/profile-visuals.yml

permissions:
  contents: write

concurrency:
  group: profile-visuals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metrics:
    name: Render profile metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Build activity overview
        id: overview
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: signal-field

      - name: Build streak and consistency cards
        id: streaks
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: activity-consistency

      - name: Build language composition bars
        id: languages
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: language-composition

      - name: Publish the generated cards to this branch
        env:
          OVERVIEW_DIR: ${{ steps.overview.outputs.ready-dir }}
          STREAK_DIR: ${{ steps.streaks.outputs.ready-dir }}
          LANG_DIR: ${{ steps.languages.outputs.ready-dir }}
        run: |
          set -euo pipefail
          mkdir -p assets/metrics
          cp "$OVERVIEW_DIR"/signal-field-*.svg assets/metrics/
          cp "$STREAK_DIR"/activity-consistency-*.svg assets/metrics/
          cp "$LANG_DIR"/language-composition-*.svg assets/metrics/
          test -s assets/metrics/signal-field-wide-dark.svg
          test -s assets/metrics/activity-consistency-wide-dark.svg
          test -s assets/metrics/language-composition-wide-dark.svg
          git add assets/metrics/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile metrics [skip ci]"
          git push

  snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate light and dark snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#36D6EC&color_dots=#EAF3FF,#B8D9F6,#82AFDF,#4F82C4,#3057A7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#69EAF1&color_dots=#0B1123,#203250,#2B4E7D,#4477B2,#82C5E8
      - name: Publish animation to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
